name: Colombia Travel CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------
  # 1. Backend: .NET 8 Web API Build
  # ----------------------------------------------------
  backend-dotnet:
    name: Build Backend (.NET 8 & EF Core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore backend/ColombiaTravel.sln

      - name: Build Solution (Release)
        run: dotnet build backend/ColombiaTravel.sln --configuration Release --no-restore

  # ----------------------------------------------------
  # 2. Frontend: Vue 3 + Vite + Tailwind Lint & Build
  # ----------------------------------------------------
  frontend-vue:
    name: Build & Audit Frontend (Vue 3 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Type Check & Linting
        run: npm run lint || true

      - name: Build Production Bundle (Vite)
        run: npm run build
